<!DOCTYPE html>


<html>
<head>
    <title>TICKETING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="title">
            <center><h1>TICKETING SYSTEM</h1></center>  
            <center><h2 id="welcome-message">Welcome to the Ticketing System</h2></center>
        </div>
        <h2>Submit a Ticket</h2>
        <h5>Fill out the form below to submit a ticket.</h5>
        <div class="ticket-sys">
            <nav>
                <ul>
                    <form>
                        <label for="ticket-name">Name:</label>
                        <input type="text" id="ticket-name" name="ticket-name" required>
                        <label id="ticket-desc" for="ticket-description">Describe your issue:</label>
                        <textarea id="ticket-description" name="ticket-description" required></textarea>
                        <button type="submit">Submit Ticket</button>       
                    </form>
                </ul>
            </nav>
            </div>
    </header>

    <footer>
    </footer>
</body>
</html>
